name: CI/CD for FastAPI Server

on:
  push:
    branches:
      - development
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2 Instance
        run: |
          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            BRANCH="development"
            EC2_INSTANCE="${{ secrets.DEV_EC2_HOST }}"
            ssh -o StrictHostKeyChecking=no root@$EC2_INSTANCE 
            echo "EC2_INSTANCE: $EC2_INSTANCE"
            # Set the branch name
            cd ForYourResearch
            git branch
            echo "you are on branch $BRANCH somechanges"
            echo {{$BRANCH}}

            # Ensure the correct branch is checked out
            echo "Current remote repository is:"
            echo "$(git remote -v)"
            git pull origin development
            echo "Pulled from $BRANCH"

            # Verify the branch
            echo "Current branch is: $(git branch --show-current)"


            # Set up virtual environment
            python3 -m venv venv
            source venv/bin/activate

            # Go into the app directory to install requirements
            cd app
            pip install -r requirements.txt
            cd ..

            # Start the FastAPI server

          
          
            
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            BRANCH="production"
            EC2_INSTANCE="${{ secrets.PROD_EC2_HOST }}"
            ssh -o StrictHostKeyChecking=no ec2-user@$EC2_INSTANCE 

            echo "EC2_INSTANCE: $EC2_INSTANCE"
            # Set the branch name
            cd ForYourResearch
            git branch
            echo "you are on branch $BRANCH somechanges"
            echo {{$BRANCH}}

            # Ensure the correct branch is checked out
            echo "Current remote repository is:"
            echo "$(git remote -v)"
            git pull origin development
            echo "Pulled from $BRANCH"

            # Verify the branch
            echo "Current branch is: $(git branch --show-current)"


            # Set up virtual environment
            python3 -m venv venv
            source venv/bin/activate

            # Go into the app directory to install requirements
            cd app
            pip install -r requirements.txt
            cd ..

            # Start the FastAPI server
          
          fi
          
          
         


