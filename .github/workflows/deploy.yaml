name: CI/CD for FastAPI Server

on:
  push:
    branches:
      - development
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2 Instance
        run: |
          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            BRANCH="development"
            EC2_INSTANCE="${{ secrets.DEV_EC2_HOST }}"
            USERNAME="root"
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            BRANCH="production"
            EC2_INSTANCE="${{ secrets.PROD_EC2_HOST }}"
            USERNAME="ec2-user"
          fi

          # Echo the EC2 instance, branch, and username
          echo "EC2_INSTANCE: $EC2_INSTANCE"
          echo "BRANCH: $BRANCH"
          echo "USERNAME: $USERNAME"

          ssh -o StrictHostKeyChecking=no $USERNAME@$EC2_INSTANCE << 'EOF'
            cd ForYourResearch
            echo "Current directory: $(pwd)"
            echo "Fetching latest changes..."
            git fetch
            echo "Checking out branch $BRANCH..."
            git checkout $BRANCH
            echo "Pulling latest changes from $BRANCH..."
            git pull origin $BRANCH
            echo "Pulled from $BRANCH"

            # Verify the branch
            echo "Current branch is: $(git branch --show-current)"

            # Set up virtual environment
            python3 -m venv venv
            source venv/bin/activate

            # Go into the app directory to install requirements
            cd app

            pip install -r requirements.txt
            pip install "fastapi[standard]"
            pip install mangum
            pip install requests
            pip install firebase_admin
            pip install sqlalchemy
            pip install psycopg2-binary
            pip install uvicorn

            pip freeze>requirements.txt
            cd ..

            echo "Killing the server before staring Caddy"
            if lsof -i:8000 -t > /dev/null
            then
              echo "Server running on port 8000. Stopping it..."
              kill -9 $(lsof -i:8000 -t)
            else
              echo "No server running on port 8000."
            fi

            if ! pgrep -x "caddy" > /dev/null
            then
              echo "Caddy is not running. Starting Caddy..."
              cd ..
              caddy start
              cd ForYourResearch
            else
              echo "Caddy is already running."
            fi

            # Start the FastAPI server

            echo "Starting FastAPI server..."
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 & disown

          EOF


          #MANUAL STEPS
              #check caddy 
              # Start server at  (keep server running even if terminal is closed)
              


          #run caddy first and then run server
