name: CI/CD for FastAPI Server

on:
  push:
    branches:
      - development
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2 Instance
        run: |
          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            EC2_INSTANCE="${{ secrets.DEV_EC2_HOST }}"
            BRANCH="development"
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            EC2_INSTANCE="${{ secrets.PROD_EC2_HOST }}"
            BRANCH="production"
          fi

          ssh -o StrictHostKeyChecking=no ec2-user@$EC2_INSTANCE << 'EOF'
            # Start Caddy server
            sudo caddy start
           # Set the branch name
            git branch

            # Fetch and pull the latest code
            git fetch origin
            git checkout $BRANCH

            # Navigate to the project directory
            cd ForYourResearch

            # Pull code after cd-ing into repository folder
            git pull origin $BRANCH



            # Create and activate a virtual environment
            python3 -m venv venv
            source venv/bin/activate

            #go into app to get requirements.txt
            cd app

            # Install requirements
            pip install setproctitle==1.3.3
            pip install -r requirements.txt

            #come out from the app folder
            cd ..

            # Kill the existing FastAPI server
            PID=$(lsof -t -i :8000)  # Get the PID of the process using port 8000
            if [ -n "$PID" ]; then
              sudo kill -9 $PID  # Kill the process if found
            fi

            # Start the FastAPI server
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &

            disown
            
            exit
          EOF
