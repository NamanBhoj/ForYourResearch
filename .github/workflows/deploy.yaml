name: CI/CD for FastAPI Server

on:
  push:
    branches:
      - development
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change to your AWS region

      - name: Deploy to EC2 Instance
        run: |
          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            EC2_INSTANCE_ID="${{ secrets.DEV_EC2_HOST }}"
            BRANCH="development"
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            EC2_INSTANCE_ID="${{ secrets.PROD_EC2_HOST }}"
            BRANCH="production"
          fi

          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy FastAPI server" \
            --parameters commands='sudo caddy start' \
            --parameters commands='cd ForYourResearch/app' \
            --parameters commands="git pull origin $BRANCH" \
            --parameters commands='pip install -r requirements.txt' \
            --parameters commands='pkill -f "fastapi run"' \
            --parameters commands='nohup fastapi run &'
