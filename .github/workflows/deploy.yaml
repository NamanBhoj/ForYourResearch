name: CI-CD for Lambda

on:
  push:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Deployment to Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-2'
        run: |
          cd app
          zip -r ../app.zip .
          cd ..
          # Update the Lambda function with the new code
          aws lambda update-function-code --function-name fyr-api --zip-file fileb://app.zip

      - name: Wait for Lambda Update to Complete
        run: |
          echo "Waiting for 30 seconds to ensure Lambda update is complete"
          sleep 30  # Wait for 30 seconds before attempting to publish the version

      - name: Publish New Lambda Version
        id: publish_version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-2'
        run: |
          # Publish a new Lambda version and capture the version number
          VERSION=$(aws lambda publish-version --function-name fyr-api --query Version --output text)
          echo "::set-output name=version::$VERSION"

      - name: Update Development Alias
        if: github.ref == 'refs/heads/development'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-2'
        run: |
          # Update the development alias to point to the new version
          aws lambda update-alias \
            --function-name fyr-api \
            --name development \
            --function-version ${{ steps.publish_version.outputs.version }}

      - name: Update Production Alias
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-2'
        run: |
          # Update the production alias to point to the new version
          aws lambda update-alias \
            --function-name fyr-api \
            --name production \
            --function-version ${{ steps.publish_version.outputs.version }}
